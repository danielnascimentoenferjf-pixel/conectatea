<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ConectaTEA - Login</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<header>

    <h1>ConectaTEA</h1>

    <p>
        Plataforma de apoio à inclusão escolar
    </p>

</header>

<section class="banner">

    <div class="card login-card">

        <h2>Entrar no Sistema</h2>

        <input
            type="text"
            id="nomeCrianca"
            placeholder="Nome da criança">

        <input
            type="number"
            id="idadeCrianca"
            placeholder="Idade">

        <input
            type="text"
            id="turmaCrianca"
            placeholder="Turma">

        <input
            type="text"
            id="humorInicial"
            placeholder="Humor atual">

        <button onclick="fazerLogin()">

            Entrar

        </button>

    </div>

</section>

<script src="js/script.js"></script>

</body>
</html>
